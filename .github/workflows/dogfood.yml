name: Dogfood

# Spec §13.5 item 5: the freshest test path for the action, independent
# of releases and baked runner images. Builds the binary from the PR
# head and points the action's shim at it directly via
# AGENTIC_REVIEW_BIN, so every PR to this repo reviews itself with its
# own in-flight changes.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    # Fork PRs run GitHub-hosted: the ARC scale set's privileged dind sidecar
    # must never execute fork code (phatlab AGENTS.md, Security Posture). A
    # deleted fork (null head.repo) also routes to the hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || 'arc-ubuntu-24.04-arm64' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Stamped to match shim/index.mjs's EXPECTED_VERSION so the shim's
      # --version check on $AGENTIC_REVIEW_BIN passes (spec §13.1: baking
      # or pinning a matching version is never a correctness dependency
      # for any *other* ladder step, but this one is a direct override
      # the shim still verifies before trusting it). Read out of the shim
      # itself rather than duplicated here, so a version bump can't
      # silently drop this job to the download rung.
      - run: |
          version=$(sed -n 's/^export const EXPECTED_VERSION = "\(.*\)";$/\1/p' shim/index.mjs)
          go build -ldflags "-X main.version=${version}" -o "${RUNNER_TEMP}/agentic-review-bin" ./cmd/agentic-review

      - uses: ./
        env:
          AGENTIC_REVIEW_BIN: ${{ runner.temp }}/agentic-review-bin
        with:
          endpoint: ${{ vars.AGENTIC_REVIEW_ENDPOINT }}
          api_key: ${{ secrets.AGENTIC_REVIEW_API_KEY }}

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: agentic-review-run
          path: ${{ runner.temp }}/agentic-review/
          if-no-files-found: ignore
