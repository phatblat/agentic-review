name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Fork PRs run GitHub-hosted: the ARC scale set's privileged dind sidecar
    # must never execute fork code (phatlab AGENTS.md, Security Posture). A
    # deleted fork (null head.repo) also routes to the hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || 'arc-ubuntu-24.04-arm64' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v4.2.5
      - run: just check

  build:
    needs: check
    # Same fork routing as check.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || 'arc-ubuntu-24.04-arm64' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v4.2.5
      # Builds every release platform from .goreleaser.yaml's builds (targets,
      # flags, ldflags) without publishing, so a broken build config fails
      # here, not at tag time. Asset names and checksums.txt are produced only
      # by `goreleaser release` on a tag.
      - run: just snapshot
